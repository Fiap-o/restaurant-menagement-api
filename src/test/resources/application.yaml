spring:
  application:
    name: restaurant-management
  datasource:
    url: jdbc:h2:mem:restaurant_management;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: "chave-secreta-para-o-tech-challenge-troque-em-producao-123456"
  expiration: 3600000

server:
  port: 8080
